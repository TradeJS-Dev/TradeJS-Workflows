name: Reusable strategy npm publish

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js major used by the strategy repository
        required: false
        type: string
        default: '24'
      yarn-version:
        description: Yarn release activated through Corepack
        required: false
        type: string
        default: 4.13.0
      npm-tag:
        description: npm distribution tag
        required: false
        type: string
        default: latest
    secrets:
      npm-token:
        description: Optional bootstrap token when npm trusted publishing is unavailable
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v6
      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org
      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@${{ inputs.yarn-version }} --activate
      - name: Install immutable dependencies
        run: yarn install --immutable
      - name: Verify release candidate
        run: yarn checks
      - name: Publish with provenance
        run: npm publish --access public --provenance --tag "${NPM_TAG}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
          NPM_TAG: ${{ inputs.npm-tag }}
